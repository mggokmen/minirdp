<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MiniRDP Giriş</title>
<style>
body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:#1e1f24;font-family:system-ui,sans-serif;color:#eee}
form{background:#2a2c33;padding:32px;border-radius:12px;width:300px;box-shadow:0 10px 40px #0006}
h1{margin:0 0 20px;font-size:20px}
input{width:100%;box-sizing:border-box;padding:10px;border-radius:6px;border:1px solid #444;background:#1e1f24;color:#eee;font-size:16px}
button{margin-top:14px;width:100%;padding:10px;border:0;border-radius:6px;background:#3b82f6;color:#fff;font-size:16px;cursor:pointer}
.err{color:#f87171;font-size:14px;margin-top:10px;display:none}
</style></head><body>
<form method="post" action="/login">
<h1>🖥️ MiniRDP</h1>
<input type="password" name="password" placeholder="Şifre" autofocus required>
<button type="submit">Bağlan</button>
<div class="err" id="err">Şifre hatalı.</div>
</form>
<script>if(location.search.includes('hata'))document.getElementById('err').style.display='block'</script>
</body></html>
